name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build-test:
    name: Test (${{ matrix.os }}, ${{ matrix.flavor }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        flavor: [EXILED, LabAPI]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Restore bot and tests
        run: dotnet restore bot/Server_Qcha.Bot.sln
      - name: Build bot and tests
        run: dotnet build bot/Server_Qcha.Bot.sln -c Release --no-restore -p:PluginTcpFlavor=${{ matrix.flavor }}
      - name: Test bot and plugin TCP implementations
        run: dotnet test bot/Server_Qcha.Bot.sln -c Release --no-build -p:PluginTcpFlavor=${{ matrix.flavor }} --filter 'Category!=LiveDatabase' --logger 'trx;LogFileName=tests.trx' --results-directory TestResults
      - name: Build standalone daemon
        run: dotnet build bot/src/Server_Qcha.Daemon/Server_Qcha.Daemon.csproj -c Release
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}-${{ matrix.flavor }}
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14

  compatibility:
    name: Legacy bot and API build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test Server_Qcha.Bot/Server_Qcha.Bot.sln -c Release --logger 'trx;LogFileName=legacy.trx' --results-directory TestResults
      - run: dotnet build Server_Qchat_API/Server_Qchat_API.csproj -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-legacy
          path: TestResults/*.trx
          retention-days: 14
