<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Qridge</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('qb-theme');
        document.documentElement.dataset.theme = (t === 'light' || t === 'dark') ? t : 'dark';
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    })();
  </script>
  <link rel="stylesheet" href="./vendor/element-plus.css" />
  <link rel="stylesheet" href="./css/theme.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/overview.css" />
  <link rel="stylesheet" href="./css/terminal.css" />
</head>
<body>
<div id="app">
  <!-- 登录页 -->
  <login-view v-if="!session"></login-view>

  <!-- 主控制台布局 -->
  <el-container v-else class="layout" direction="vertical">
    <app-header></app-header>
    <el-container style="overflow:hidden">
      <app-sidebar></app-sidebar>
      <el-main class="main">
        <overview-view v-if="page === 'overview'"></overview-view>
        <servers-view v-if="page === 'servers'"></servers-view>
        <local-admin-view v-if="page === 'local'"></local-admin-view>
        <bot-view v-if="page === 'bot'"></bot-view>
        <database-view v-if="page === 'database'"></database-view>
        <accounts-view v-if="page === 'accounts'"></accounts-view>
        <audit-view v-if="page === 'audit'"></audit-view>
        <logging-view v-if="page === 'logging'"></logging-view>
      </el-main>
    </el-container>
  </el-container>

  <!-- 全局弹窗组件 -->
  <app-dialogs></app-dialogs>
</div>

<script src="./vendor/vue.global.prod.js"></script>
<script src="./vendor/element-plus.full.min.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
